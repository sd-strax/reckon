# Example tenant capability config (design/03-capability-layer.md §3.2) for the
# bundled lateral-movement-via-rdp fixture scenario. Point the backend at it with
#   capability:
#     config_path: examples/capability/lateral-movement.yaml
#     fixture_root: fixtures
# in the main reckon config, then GET /api/capabilities to see the verbs light up.

tenant: demo

adapters:
  fixture:
    class: fixture
    enabled: true
    scenario: lateral-movement-via-rdp
  # Installed but NOT enabled (11 §6.2): the enablement surface's demo gap.
  # get_host_context binds to this instance, so the verb reports unavailable
  # until an operator enables it — the workbench's gap hint + schema form
  # (11 §5.1) close it end-to-end, writing back into this file.
  fixture_context:
    class: fixture
    enabled: false
    scenario: lateral-movement-via-rdp
  # Real adapters land in Phase E; disabled here so v0 runs on fixtures only.
  crowdstrike_falcon:
    class: native_api
    enabled: false

bindings:
  enumerate_logons:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        target:
          # Demo scenario is single-host: default to the scenario host so a
          # host-less or differently-shaped agent query still resolves (the
          # fixture match below is wildcarded to tolerate hostname variance).
          hostname: '${entity.host.hostname ?? "WIN-FILE01"}'
          # A USER-rooted query ({"user":{"name":"svc_backup"}}) reaches the
          # account's historical baseline (logon-baseline-*.json, matched on
          # target.user); a host-rooted query omits the key and sees only the
          # incident-day logons. The baseline is also time-scoped, so a
          # 30-day window answers "is RDP normal for this account?" and a
          # 24-hour window does not — the discriminating test behind the
          # competing-hypotheses demo (01 §x-hypothesis).
          user: '${entity.user.name?}'
        outcome: '${outcome ?? "SUCCESS"}'
        window:
          from: '${window.from | iso8601}'
          to: '${window.to | iso8601}'

  get_process_ancestry:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        host:
          hostname: '${entity.host.hostname ?? "WIN-FILE01"}'

  get_network_connections:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        endpoint:
          hostname: '${entity.host.hostname ?? "WIN-FILE01"}'

  search_alerts:
    - adapter: fixture
      operation: replay
      priority: 100
      params: {}

  # The change-record check: "was there a change ticket / maintenance window
  # covering WIN-FILE01?" No fixture answers this verb, so the result is
  # COMPLETE with zero cases — evidence of ABSENCE against the legitimate-
  # maintenance hypothesis, which is exactly what the verdict residual and the
  # discriminating test need (an unbound verb would only say "unavailable").
  query_external_cases:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        filter: '${filter?}'
        status: '${status?}'

  # Bound to the disabled fixture_context instance above — the shipped
  # installed-not-enabled gap the enablement flow closes.
  get_host_context:
    - adapter: fixture_context
      operation: replay
      priority: 100
      params:
        host:
          hostname: "${entity.host.hostname}"

policies:
  default_window:
    investigation: PT24H
    hunt: PT7D
