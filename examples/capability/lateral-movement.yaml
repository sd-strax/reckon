# Example tenant capability config (design/03-capability-layer.md §3.2) for the
# bundled lateral-movement-via-rdp fixture scenario. Point the backend at it with
#   capability:
#     config_path: examples/capability/lateral-movement.yaml
#     fixture_root: fixtures
# in the main reckon config, then GET /api/capabilities to see the verbs light up.

tenant: demo

adapters:
  fixture:
    class: fixture
    enabled: true
    scenario: lateral-movement-via-rdp
  # Installed but NOT enabled (11 §6.2): the enablement surface's demo gap.
  # get_host_context binds to this instance, so the verb reports unavailable
  # until an operator enables it — the workbench's gap hint + schema form
  # (11 §5.1) close it end-to-end, writing back into this file.
  fixture_context:
    class: fixture
    enabled: false
    scenario: lateral-movement-via-rdp
  # Real adapters are disabled here so v0 runs on fixtures only.
  crowdstrike_falcon:
    class: native_api
    enabled: false

bindings:
  enumerate_logons:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        target:
          # The scenario has two hosts. A HOST-rooted query names its host and
          # sees only that host's logons; a USER-rooted query omits the key
          # and sees the account's logons on every host.
          hostname: '${entity.host.hostname?}'
          # A USER-rooted query ({"user":{"name":"svc_backup"}}) reaches the
          # account's historical baseline (logon-baseline-*.json, matched on
          # target.user); a host-rooted query omits the key and sees only the
          # incident-day logons. The baseline is also time-scoped, so a
          # 30-day window answers "is RDP normal for this account?" and a
          # 24-hour window does not — the discriminating test behind the
          # competing-hypotheses demo (01 §x-hypothesis).
          user: '${entity.user.name?}'
        outcome: '${outcome ?? "SUCCESS"}'
        window:
          from: '${window.from | iso8601}'
          to: '${window.to | iso8601}'

  # The process names the chain to walk; the host narrows when the call names
  # one. A call naming neither spans every host the scenario knows, which is
  # the fleet, not an error.
  get_process_ancestry:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        process:
          pid: '${entity.process.pid?}'
        host:
          hostname: '${entity.host.hostname?}'

  get_network_connections:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        endpoint:
          hostname: '${entity.host.hostname?}'

  search_alerts:
    - adapter: fixture
      operation: replay
      priority: 100
      params: {}

  # The case system of record answers two different questions in this scenario,
  # and the fixtures discriminate between them on the `queue` input:
  #
  # - The analyst's queue (the picker opens on policies.case_queue, "SOC Tier
  #   2") returns the three open Tier 2 incidents (case-queue-*.json) — the
  #   demo's opening move, 14 §4.1/4.2.
  # - The change-record check ("was there a change ticket / maintenance window
  #   covering WIN-FILE01?") is a free-text filter with no queue, so it matches
  #   no fixture and is COMPLETE with zero cases — evidence of ABSENCE against
  #   the legitimate-maintenance hypothesis, which is exactly what the verdict
  #   residual and the discriminating test need (an unbound verb would only say
  #   "unavailable").
  #
  # The fixture adapter matches parameter values exactly and cannot do a text
  # search, so a free-text filter narrows nothing here; a real SoR adapter
  # applies both axes.
  query_external_cases:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        filter: '${filter?}'
        queue: '${queue?}'
        status: '${status?}'

  # The second step of the case-seed flow (14 §3) and the agent's "read the
  # full case before pivoting" directive: one detail fixture per queued case
  # (case-detail-*.json), matched on the case id, so any of the three can be
  # picked and the seed resolves on exactly one case (fail-closed, 14 §2).
  get_external_case_details:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        case_id: '${case_id}'

  # The hunt verbs (03 §2.2–2.7). Every fixture below is time-scoped, so "this
  # week" reaches them and a window after the incident is a COMPLETE empty
  # answer — the citeable absence a fleet sweep records for its clean hosts.
  #
  # The fleet-wide pair takes its entity optionally: no entity sweeps every
  # host the scenario knows (two of them planted, the rest absent); a host or
  # account narrows. The fixture adapter matches values exactly and cannot
  # search text, so the image/command-line filters are wildcarded here; a real
  # adapter applies them.
  get_process_executions:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        subject:
          hostname: '${entity.host.hostname?}'
          user: '${entity.user.name?}'
        image_hash: '${image_hash?}'
        image_path: '${image_path?}'
        command_line_contains: '${command_line_contains?}'
        limit: '${limit ?? 200}'
        window:
          from: '${window.from | iso8601}'
          to: '${window.to | iso8601}'

  get_persistence_artifacts:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        host:
          hostname: '${entity.host.hostname?}'
        limit: '${limit ?? 200}'
        window:
          from: '${window.from | iso8601}'
          to: '${window.to | iso8601}'

  get_file_activity:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        file:
          hash: '${entity.file.hash?}'
          path: '${entity.file.path?}'
          hostname: '${entity.host.hostname?}'
        limit: '${limit ?? 200}'
        window:
          from: '${window.from | iso8601}'
          to: '${window.to | iso8601}'

  resolve_dns:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        name:
          domain: '${entity.domain?}'
          hostname: '${entity.host.hostname?}'
        limit: '${limit ?? 200}'
        window:
          from: '${window.from | iso8601}'
          to: '${window.to | iso8601}'

  get_privilege_changes:
    - adapter: fixture
      operation: replay
      priority: 100
      params:
        target:
          user: '${entity.user.name?}'
          hostname: '${entity.host.hostname?}'
        limit: '${limit ?? 200}'
        window:
          from: '${window.from | iso8601}'
          to: '${window.to | iso8601}'

  # Fan-out by design (03 §3.4): every bound source answers and the results
  # merge. One source here; a real tenant adds a binding per source. The
  # scenario's DNS, network and file fixtures each also answer this verb, so a
  # pivot on either address of the connection (its source or its
  # destination), the domain or the dropped file's hash finds its sightings;
  # any other indicator is a COMPLETE empty answer.
  pivot_on_indicator:
    - adapter: fixture
      operation: replay
      priority: 100
      fanout: true
      params:
        indicator:
          ip: '${entity.ip?}'
          domain: '${entity.domain?}'
          url: '${entity.url?}'
          hash: '${entity.file.hash?}'
        limit: '${limit ?? 500}'
        window:
          from: '${window.from | iso8601}'
          to: '${window.to | iso8601}'

  # query_logs is deliberately unbound: the escape hatch is for a real log
  # source, and a fixture cannot run a query. Unbound, it is listed
  # unavailable and trimmed from the agent's tool set (03 §6.3).

  # Bound to the disabled fixture_context instance above — the shipped
  # installed-not-enabled gap the enablement flow closes.
  get_host_context:
    - adapter: fixture_context
      operation: replay
      priority: 100
      params:
        host:
          hostname: "${entity.host.hostname}"

policies:
  default_window:
    investigation: PT24H
    hunt: PT7D
  # The work queue the case system of record assigns this team's cases to
  # (14 §4.2): the "From a case…" picker opens on it, and query_external_cases
  # takes it as its `queue` input. A ServiceNow assignment group here; a Jira
  # project or TheHive team in another shop.
  case_queue: SOC Tier 2
