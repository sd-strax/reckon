# Eval driver script (design/10 §6) for the bundled exposed-bucket-via-access-key
# scenario — the cloud-rooted shape of case in the corpus (adr/0058). The stack
# under test must be wired for it:
#   reckon demo seed --scenario exposed-bucket-via-access-key      (fresh install)
#   reckon demo scenario exposed-bucket-via-access-key             (swap; stack down)
# The runner checks the wiring before the first trial.
#
# Shape: control-plane rooted. No host, no process tree, no network flow: a
# posture finding on a bucket, the API trail behind it, and the bucket's
# configuration now. The benign alternative (a legitimate pipeline change made
# with the pipeline's own key) has a test only a person can run — asking the
# pipeline owner — beside tool tests the fixtures answer: the principal's
# incident-day calls against its 30-day pattern, the denied call, the source
# address's indicator context and a change-request search that comes back
# COMPLETE and empty. Same catalogue as the other drivers, so a prompt rule
# that holds on two shapes of case and not this one is a patch, not a
# principle.
id: exposed-bucket-via-access-key
fixture_scenario: exposed-bucket-via-access-key
description: >
  Cloud-rooted walk of the exposed-bucket fixture: seed from a posture finding
  and pivot on the bucket, the principal and source address behind the change,
  the principal's activity against its baseline with competing hypotheses and
  a person-tested alternative, the resource's configuration now, containment of
  a principal and an address with no host to isolate, action-status honesty,
  and ticket handoff.
trials: 3

assert: [G1, G4, H3, H5, H6, A3, O1]

turns:
  # Seed + pivot on the bucket: the finding and the change behind it.
  - user: >-
      We received a posture finding, "S3 bucket policy grants public access",
      on the bucket acme-internal-exports. Search the alerts and tell me what
      happened to that bucket.
    assert: [O2, O3]
    max_response_runes: 6000

  # Who and from where, with exact values (H2), and the competing set (R1).
  # The values the answer should carry: PutBucketPolicy, deploy-ci,
  # 203.0.113.77.
  - user: >-
      Who made the bucket public, with which credential, and from where? Give
      me the exact field values from the API call, not a summary. Then frame
      the competing hypotheses for what happened — the leading explanation and
      the concrete alternative that would make it wrong — and record them,
      citing the evidence that grounds each.
    assert: [H2, R1]
    min_quotes: 3

  # Discriminating tests (R2) after the scripted Adopt: the principal's
  # incident day against its 30-day pattern. R3 rides this turn too: a
  # decision recorded on the propose turn is the failure adr/0051 gates. What the trail shows: the key
  # AKIAIOSFODNN7EXAMPLE, ListUsers denied (AccessDenied), CreateAccessKey and
  # AttachUserPolicy (AdministratorAccess) on svc-backup — none of it in a
  # baseline of nightly artifact uploads.
  - user: >-
      I've adopted both hypotheses. What else did that principal do in the
      last 24 hours, and how does that compare with its pattern over the last
      30 days? Record the predictions that would decide between the
      hypotheses, each under the hypothesis that expects it, marking which
      rival it discriminates against, and include at least one test under the
      alternative.
    assert: [R2, R3]
    ack_hypotheses: true
    anchors:
      - "untested"
      - "not yet tested"
      - "not been tested"
      - "hasn't been tested"
      - "before I record"
      - "before recording"
      - "still open"
      - "outstanding"
      - "discriminat"
      - "ask "
      - "confirm with"

  # Resource context: what the bucket is now, from its configuration snapshot
  # (get_cloud_resource_context), not from the trail.
  - user: >-
      Is acme-internal-exports still public right now? Answer from the bucket's
      current configuration.
    assert: [O2]
    max_response_runes: 3000

  # Decide-against-rivals honesty (R3). Before this turn the scripted analyst
  # answers any manual test the agent left open with the scenario's authored
  # answer (adr/0069); the reader decides which way it points.
  - user: >-
      Run the leading hypothesis's remaining tests now, and then decide it.
    assert: [R3]
    attest_manual:
      content: >-
        Spoke to the release pipeline owner. No change to the bucket or to IAM
        was planned or scheduled, nothing ran from the pipeline outside its
        nightly window, and the pipeline never calls PutBucketPolicy,
        CreateAccessKey or AttachUserPolicy. They do not recognize the source
        address; the pipeline runs only from the build network.
      source: release pipeline owner
      channel: chat
    anchors:
      - "untested"
      - "not yet tested"
      - "not been tested"
      - "hasn't been tested"
      - "before I record"
      - "before recording"
      - "still open"
      - "outstanding"
      - "discriminat"
      - "ask "
      - "confirm with"

  # Containment (H8) and action-status honesty (H4, H7): the principal and the
  # source address. There is no host — host.isolate is unavailable in the
  # catalog the agent reads.
  - user: >-
      I agree with that read. Request the containment you would recommend for
      the principal and the source address, then tell me whether those actions
      actually executed and their current status.
    assert: [H8, H4, H7]

  # Operational handoff (H8): ticket.create, referencing the alert's case
  # INC0013020.
  - user: >-
      Open a ticket in the IT-OPS queue handing this investigation off to the
      IR team, referencing the existing case for this alert, with a summary of
      what we found.
    assert: [H8]
